// Helper to generate unique ID
const generateId = () => {
  const now = new Date();
  const day = String(now.getDate()).padStart(2, '0');
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const year = String(now.getFullYear()).slice(-2);
  const seq = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
  return `Mix-${day}/${month}/${year}-${seq}`;
};

// Helper to determine status based on risk levels
// CLOSED status only achieved through workflow: Start Work → Mark Complete
const determineStatus = (categories) => {
  const risks = Object.values(categories).map(c => c.riskLevel);
  if (risks.includes('critical')) return 'open';
  if (risks.includes('high')) return 'open';
  return 'pending'; // Medium and Low go to pending, CLOSED only via workflow
};

// Helper to get highest risk level
const getHighestRisk = (categories) => {
  const risks = Object.values(categories).map(c => c.riskLevel);
  if (risks.includes('critical')) return 'critical';
  if (risks.includes('high')) return 'high';
  if (risks.includes('medium')) return 'medium';
  return 'low';
};

function SafetyInspectionApp() {
  const [currentView, setCurrentView] = useState('home');
  const [savedInspections, setSavedInspections] = useState(() => {
    // Load saved inspections list from localStorage
    const saved = localStorage.getItem(STORAGE_KEYS.SAVED_INSPECTIONS);
    if (saved) {
      try {
        return JSON.parse(saved);
      } catch (e) {
        console.error('Error loading saved inspections:', e);
      }
    }
    return [];
  });
  const [inspectionData, setInspectionData] = useState(() => {
    // Load from localStorage on initial render
    const saved = localStorage.getItem(STORAGE_KEYS.INSPECTION_DATA);
    if (saved) {
      try {
        return JSON.parse(saved);
      } catch (e) {
        console.error('Error loading inspection data:', e);
      }
    }
    return { 
      date: new Date().toISOString().split('T')[0], 
      shift: '', 
      inspector: '', 
      categories: {} 
    };
  });
  const [showReport, setShowReport] = useState(false);
  const [abnormalData, setAbnormalData] = useState(() => {
    // Load from localStorage on initial render
    const saved = localStorage.getItem(STORAGE_KEYS.ABNORMAL_DATA);
    if (saved) {
      try {
        return JSON.parse(saved);
      } catch (e) {
        console.error('Error loading abnormal data:', e);
      }
    }
    return {
      processType: '',
      workflowStage: 'design',
      priority: '',
      fiveMAnalysis: {},
      qualityImpact: '',
      verification: '',
      validation: '',
      description: ''
    };
  });

  const initCategories = () => {
    const cats = {};
    inspectionCategories.forEach(cat => {
      cats[cat.id] = { 
        findings: '', 
        riskLevel: 'low', 
        machine: '', 
        floor: '', 
        checklistItems: cat.checkpoints.reduce((a, i) => ({ ...a, [i]: true }), {}) 
      };
    });
    return cats;
  };

  const handleStart = () => { 
    setInspectionData(p => ({ ...p, categories: initCategories() })); 
    setCurrentView('inspection'); 
  };

  // Start fresh new inspection - clear all previous data
  const startNewInspection = () => {
    // Reset inspection data
    setInspectionData({
      date: new Date().toISOString().split('T')[0],
      shift: '',
      inspector: '',
      machine: '',
      floor: '',
      categories: {}
    });
    
    // Reset abnormal data
    setAbnormalData({
      processType: '',
      workflowStage: 'design',
      priority: '',
      fiveMAnalysis: {},
      qualityImpact: '',
      verification: '',
      validation: '',
      description: ''
    });
    
    // Clear localStorage drafts
    localStorage.removeItem(STORAGE_KEYS.INSPECTION_DATA);
    localStorage.removeItem(STORAGE_KEYS.ABNORMAL_DATA);
    localStorage.removeItem(STORAGE_KEYS.PHOTOS);
    
    // Go to setup screen
    setCurrentView('setup');
  };

  const updateCategory = (id, field, value) => {
    setInspectionData(p => ({ 
      ...p, 
      categories: { 
        ...p.categories, 
        [id]: { ...p.categories[id], [field]: value } 
      } 
    }));
  };

  const calcSummary = () => {
    let total = 0, high = 0;
    const breakdown = { low: 0, medium: 0, high: 0, critical: 0 };
    Object.values(inspectionData.categories).forEach(c => { 
      if (c.findings?.trim()) total++; 
      breakdown[c.riskLevel]++; 
      if (c.riskLevel === 'high' || c.riskLevel === 'critical') high++; 
    });
    return { totalFindings: total, highRiskItems: high, riskBreakdown: breakdown };
  };

  // Save to localStorage (for draft/current inspection)
  const saveToStorage = () => {
    localStorage.setItem(STORAGE_KEYS.INSPECTION_DATA, JSON.stringify(inspectionData));
    localStorage.setItem(STORAGE_KEYS.ABNORMAL_DATA, JSON.stringify(abnormalData));
  };

  // Save completed inspection to the list
  const saveInspectionToList = (photos = []) => {
    const newInspection = {
      id: generateId(),
      date: inspectionData.date,
      shift: inspectionData.shift,
      inspector: inspectionData.inspector,
      categories: inspectionData.categories,
      abnormalData: abnormalData,
      photos: photos,
      status: determineStatus(inspectionData.categories),
      severity: getHighestRisk(inspectionData.categories),
      createdAt: new Date().toISOString(),
      type: abnormalData.processType || 'General Inspection',
      description: abnormalData.description || 'Safety inspection completed',
      machine: Object.values(inspectionData.categories).find(c => c.machine)?.machine || '',
      floor: Object.values(inspectionData.categories).find(c => c.floor)?.floor || '',
      workflowStage: abnormalData.workflowStage,
      priority: abnormalData.priority,
      qualityImpact: abnormalData.qualityImpact
    };

    const updatedList = [newInspection, ...savedInspections];
    setSavedInspections(updatedList);
    localStorage.setItem(STORAGE_KEYS.SAVED_INSPECTIONS, JSON.stringify(updatedList));
    return newInspection.id;
  };

  // Update inspection status
  const updateInspectionStatus = (id, newStatus) => {
    const updatedList = savedInspections.map(ins => {
      if (ins.id === id) {
        return { 
          ...ins, 
          status: newStatus,
          closedAt: newStatus === 'closed' ? new Date().toISOString() : ins.closedAt
        };
      }
      return ins;
    });
    setSavedInspections(updatedList);
    localStorage.setItem(STORAGE_KEYS.SAVED_INSPECTIONS, JSON.stringify(updatedList));
  };

  // Update Machine Case with maintenance data
  const updateMachineCase = (id, maintenanceData) => {
    const updatedList = savedInspections.map(ins => {
      if (ins.id === id) {
        return {
          ...ins,
          status: maintenanceData.status,
          machineCase: {
            ...ins.machineCase,
            checklist: maintenanceData.checklist,
            replacedParts: maintenanceData.replacedParts,
            estimatedTime: maintenanceData.estimatedTime,
            actualTime: maintenanceData.actualTime,
            technicianNotes: maintenanceData.technicianNotes,
            technicianName: maintenanceData.technicianName,
            completedAt: maintenanceData.status === 'closed' ? new Date().toISOString() : null,
            updatedAt: new Date().toISOString(),
          }
        };
      }
      return ins;
    });
    setSavedInspections(updatedList);
    localStorage.setItem(STORAGE_KEYS.SAVED_INSPECTIONS, JSON.stringify(updatedList));
  };

  // Clear localStorage and start new
  const clearStorage = () => {
    localStorage.removeItem(STORAGE_KEYS.INSPECTION_DATA);
    localStorage.removeItem(STORAGE_KEYS.ABNORMAL_DATA);
    localStorage.removeItem(STORAGE_KEYS.PHOTOS);
    setInspectionData({
      date: new Date().toISOString().split('T')[0],
      shift: '',
      inspector: '',
      categories: {}
    });
    setAbnormalData({
      processType: '',
      workflowStage: 'design',
      priority: '',
      fiveMAnalysis: {},
      qualityImpact: '',
      verification: '',
      validation: '',
      description: ''
    });
  };

  const views = {
    home: <HomeScreen setCurrentView={setCurrentView} savedInspections={savedInspections} startNewInspection={startNewInspection} />,
    setup: <SetupScreen inspectionData={inspectionData} setInspectionData={setInspectionData} onStart={handleStart} onBack={() => setCurrentView('home')} />,
    inspection: <InspectionScreen 
      inspectionData={inspectionData} 
      updateCategory={updateCategory} 
      abnormalData={abnormalData} 
      setAbnormalData={setAbnormalData} 
      onComplete={() => setShowReport(true)} 
      onBack={() => setCurrentView('setup')}
      onSave={saveToStorage}
      onSaveToList={saveInspectionToList}
      storageKey={STORAGE_KEYS.PHOTOS}
    />,
    analytics: <AnalyticsDashboard data={savedInspections} onBack={() => setCurrentView('home')} />,
    pending: <ListScreen title="⏳ Pending Review" status="pending" data={savedInspections} onBack={() => setCurrentView('home')} onUpdateStatus={updateInspectionStatus} onUpdateMachineCase={updateMachineCase} />,
    inProgress: <ListScreen title="🔧 In Progress" status="in_progress" data={savedInspections} onBack={() => setCurrentView('home')} onUpdateStatus={updateInspectionStatus} onUpdateMachineCase={updateMachineCase} />,
    completed: <ListScreen title="✅ Completed" status="closed" data={savedInspections} onBack={() => setCurrentView('home')} onUpdateStatus={updateInspectionStatus} onUpdateMachineCase={updateMachineCase} />,
    openIssues: <ListScreen title="⚠️ Open Issues" status="open" data={savedInspections} onBack={() => setCurrentView('home')} onUpdateStatus={updateInspectionStatus} onUpdateMachineCase={updateMachineCase} />,
    history: <HistoryScreen data={savedInspections} onBack={() => setCurrentView('home')} />,
  };

  return (
    <div style={styles.app} className="app-container">
      <style>{`

          min-height: 100vh;

        }
        
        input, textarea, button, select { 
          font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { 
          background: ${theme.colors.border}; 
          border-radius: 3px; 
        }
        
        /* Mobile First - Default (< 480px) */
        .app-container {
          max-width: 100%;
          margin: 0 auto;
          min-height: 100vh;
        }
        
        .responsive-content {
          max-width: 100%;
        }
        
        .tiles-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        
        .quick-stats {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 8px;
        }
        
        .list-container {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        
        .modal-wrapper {
          width: 100%;
          max-width: 95vw;
        }
        
        .analytics-grid {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        
        .inspection-sections {
          display: flex;

          gap: 16px;
        }
        
        /* Small Mobile (480px+) */
        @media (min-width: 480px) {
          .app-container {
            max-width: 480px;
          }
          
          .modal-wrapper {
            max-width: 440px;
          }
        }

        @media (min-width: 600px) {
          .app-container {
            max-width: 580px;

          }
          
          .tiles-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
          }

            gap: 12px;
          }
          
          .quick-stats > div {

          .modal-wrapper {
            max-height: 95vh;
          }

            padding: 16px;
          }
        }
        
        /* Print styles */
        @media print {
          .no-print, button, .back-btn {
            display: none !important;
          }
          
          .app-container {
            max-width: 100%;
          }
        }
        
        /* Accessibility - Reduced motion */
        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
          }
        }
      `}</style>
      {views[currentView] || views.home}
      {showReport && (
        <ReportModal 
          inspectionData={inspectionData} 
          abnormalData={abnormalData} 
          summary={calcSummary()} 
          onClose={() => setShowReport(false)} 
        />
      )}
    </div>
  );
}

  const completedCount = savedInspections.filter(d => d.status === 'closed' || d.status === 'completed').length;
  const criticalCount = savedInspections.filter(d => d.severity === 'critical' && d.status === 'open').length;

  const tiles = [
    { id: 'new', icon: '📋', title: 'New Inspection', sub: 'Start audit', color: theme.colors.primary, action: () => startNewInspection() },
    { id: 'issues', icon: '⚠️', title: 'Open Issues', sub: `${openCount} unresolved`, color: theme.colors.danger, action: () => setCurrentView('openIssues') },
    { id: 'inProgress', icon: '🔧', title: 'In Progress', sub: `${inProgressCount} working`, color: theme.colors.info, action: () => setCurrentView('inProgress') },

  const getStatusColor = (status) => {
    switch(status) {

      case 'in_progress': return theme.colors.info;

            <h2 style={styles.bannerTitle}>Good Morning!</h2>

              {criticalCount > 0

          <div style={{...styles.quickStat, borderColor: theme.colors.info}}>

          <div style={{...styles.quickStat, borderColor: theme.colors.warning}}>

// Inspection Screen with Photo Upload and Save
function InspectionScreen({ inspectionData, updateCategory, abnormalData, setAbnormalData, onComplete, onBack, onSave, onSaveToList, storageKey }) {
  const [active, setActive] = useState(0);
  const [photos, setPhotos] = useState(() => {
    // Load photos from localStorage
    const saved = localStorage.getItem(storageKey);
    if (saved) {
      try {
        return JSON.parse(saved);
      } catch (e) {
        console.error('Error loading photos:', e);
      }
    }
    return [];
  });
  const [saveStatus, setSaveStatus] = useState('');
  const [savedId, setSavedId] = useState(null);
  const fileInputRef = useRef(null);
  const galleryInputRef = useRef(null);
  const cat = inspectionCategories[active];
  const data = inspectionData.categories[cat?.id] || {};

  // Save photos to localStorage whenever they change
  const savePhotosToStorage = (newPhotos) => {
    try {
      localStorage.setItem(storageKey, JSON.stringify(newPhotos));
    } catch (e) {
      console.error('Error saving photos:', e);
    }
  };

  const handlePhotoCapture = (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (event) => {
        setPhotos(prev => {
          const newPhotos = [...prev, { 
            id: Date.now() + Math.random(), 
            url: event.target.result, 
            name: file.name,
            type: 'camera',
            category: cat.id
          }];
          savePhotosToStorage(newPhotos);
          return newPhotos;
        });
      };
      reader.readAsDataURL(file);
    });
  };

  const handleGallerySelect = (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (event) => {
        setPhotos(prev => {
          const newPhotos = [...prev, { 
            id: Date.now() + Math.random(), 
            url: event.target.result, 
            name: file.name,
            type: 'gallery',
            category: cat.id
          }];
          savePhotosToStorage(newPhotos);
          return newPhotos;
        });
      };
      reader.readAsDataURL(file);
    });
  };

  const removePhoto = (id) => {
    setPhotos(prev => {
      const newPhotos = prev.filter(p => p.id !== id);
      savePhotosToStorage(newPhotos);
      return newPhotos;
    });
  };

  // Handle Save button click
  const handleSave = () => {
    onSave();
    savePhotosToStorage(photos);
    const newId = onSaveToList(photos);
    setSavedId(newId);
    setSaveStatus('saved');
    setTimeout(() => setSaveStatus(''), 3000);
  };

  // Handle Save Draft (without adding to list)
  const handleSaveDraft = () => {
    onSave();
    savePhotosToStorage(photos);
    setSaveStatus('draft');
    setTimeout(() => setSaveStatus(''), 2000);
  };

// Analytics Dashboard
function AnalyticsDashboard({ data, onBack }) {
  const totalCount = data.length;
  const openCount = data.filter(d => d.status === 'open').length;
  const inProgressCount = data.filter(d => d.status === 'in_progress').length;
  const pendingCount = data.filter(d => d.status === 'pending').length;
  const completedCount = data.filter(d => d.status === 'closed' || d.status === 'completed').length;
  const criticalCount = data.filter(d => d.severity === 'critical').length;
  const highCount = data.filter(d => d.severity === 'high').length;
  const mediumCount = data.filter(d => d.severity === 'medium').length;
  const lowCount = data.filter(d => d.severity === 'low').length;

  // Count by priority
  const priorityHighCount = data.filter(d => d.priority === 'high').length;
  const priorityMediumCount = data.filter(d => d.priority === 'medium').length;
  const priorityLowCount = data.filter(d => d.priority === 'low').length;
  const priorityNotSetCount = data.filter(d => !d.priority).length;

  // Count by machine
  const machineStats = machineOptions.map(m => ({
    machine: m,
    count: data.filter(d => d.machine === m).length
  })).filter(m => m.count > 0).sort((a, b) => b.count - a.count);

  // Count by floor/lantai
  const floorStats = [...new Set(data.map(d => d.floor).filter(f => f))].map(f => ({
    floor: f,
    label: f === 'A' ? 'A Chemicals' : f === 'Q' ? 'Q Chemicals' : `Lantai ${f}`,
    count: data.filter(d => d.floor === f).length
  })).sort((a, b) => b.count - a.count);

  // Count by type
  const typeStats = [...new Set(data.map(d => d.type))].map(t => ({
    type: t,
    count: data.filter(d => d.type === t).length
  })).sort((a, b) => b.count - a.count).slice(0, 5);

  const stats = [
    { l: 'Open', v: openCount, color: theme.colors.danger },
    { l: 'Progress', v: inProgressCount, color: theme.colors.info },
    { l: 'Pending', v: pendingCount, color: theme.colors.warning },
    { l: 'Closed', v: completedCount, color: theme.colors.success },
  ];

  // Status breakdown for chart
  const statusBreakdown = [
    { label: 'Open', value: openCount, color: theme.colors.danger },
    { label: 'In Progress', value: inProgressCount, color: theme.colors.info },
    { label: 'Pending', value: pendingCount, color: theme.colors.warning },
    { label: 'Closed', value: completedCount, color: theme.colors.success },
  ];

  // Priority breakdown for chart
  const priorityBreakdown = [
    { label: 'High', value: priorityHighCount, color: theme.colors.danger, icon: '🔴' },
    { label: 'Medium', value: priorityMediumCount, color: theme.colors.warning, icon: '🟡' },
    { label: 'Low', value: priorityLowCount, color: theme.colors.success, icon: '🟢' },
    { label: 'Not Set', value: priorityNotSetCount, color: theme.colors.textMuted, icon: '⚪' },
  ];

  return (
    <div style={styles.screen}>
      <header style={styles.headerCompact}>
        <button style={styles.back} onClick={onBack}>←</button>
        <h1 style={styles.headerTitleC}>📊 Analytics</h1>
        <div style={{ width: 42 }} />
      </header>
      <main style={styles.main} className="responsive-content">
        <div style={styles.quickStats} className="quick-stats">
          {stats.map((s, i) => (
            <div key={i} style={{...styles.quickStat, borderColor: s.color}}>
              <span style={{...styles.quickStatNum, color: s.color}}>{s.v}</span>
              <span style={styles.quickStatLabel}>{s.l}</span>
            </div>
          ))}
        </div>

        {totalCount === 0 ? (
          <div style={styles.emptyActivity}>
            <span style={{ fontSize: 48 }}>📊</span>
            <p style={{ color: theme.colors.textMuted, marginTop: 8 }}>No data available yet. Complete some inspections!</p>
          </div>
        ) : (
          <div className="analytics-grid">
            {/* Risk Distribution */}
            <div style={styles.analyticsCard} className="section-card">
              <h4 style={styles.analyticsTitle}>⚡ Risk Distribution</h4>
              {riskLevels.map(r => {
                const count = data.filter(d => d.severity === r.value).length;
                const pct = totalCount > 0 ? (count / totalCount) * 100 : 0;
                return (
                  <div key={r.value} style={styles.barRow}>
                    <span style={styles.barLabel}>{r.label}</span>
                    <div style={styles.barTrack}>
                      <div style={{...styles.barFill, backgroundColor: r.color, width: `${pct}%`}} />
                    </div>
                    <span style={styles.barCount}>{count}</span>
                  </div>
                );
              })}
            </div>

            {/* Status Distribution */}
            <div style={styles.analyticsCard}>
              <h4 style={styles.analyticsTitle}>📊 Status Distribution</h4>
              {statusBreakdown.map(s => {
                const pct = totalCount > 0 ? (s.value / totalCount) * 100 : 0;
                return (
                  <div key={s.label} style={styles.barRow}>
                    <span style={styles.barLabel}>{s.label}</span>
                    <div style={styles.barTrack}>
                      <div style={{...styles.barFill, backgroundColor: s.color, width: `${pct}%`}} />
                    </div>
                    <span style={styles.barCount}>{s.value}</span>
                  </div>
                );
              })}
            </div>

            {/* Priority Distribution */}
            <div style={styles.analyticsCard} className="section-card">
              <h4 style={styles.analyticsTitle}>🎯 Priority Distribution</h4>
              {priorityBreakdown.map(p => {
                const pct = totalCount > 0 ? (p.value / totalCount) * 100 : 0;
                return (
                  <div key={p.label} style={styles.barRow}>
                    <span style={styles.barLabel}>{p.icon} {p.label}</span>
                    <div style={styles.barTrack}>
                      <div style={{...styles.barFill, backgroundColor: p.color, width: `${pct}%`}} />
                    </div>
                    <span style={styles.barCount}>{p.value}</span>
                  </div>
                );
              })}
            </div>

            {/* By Machine */}
            {machineStats.length > 0 && (
              <div style={styles.analyticsCard}>
                <h4 style={styles.analyticsTitle}>🔧 By Machine</h4>
                {machineStats.slice(0, 5).map((m, i) => (
                  <div key={i} style={styles.barRow}>
                    <span style={styles.barLabel}>{m.machine}</span>
                    <div style={styles.barTrack}>
                      <div style={{...styles.barFill, backgroundColor: theme.colors.info, width: `${(m.count / totalCount) * 100}%`}} />
                    </div>
                    <span style={styles.barCount}>{m.count}</span>
                  </div>
                ))}
              </div>
            )}

            {/* By Floor/Lantai */}
            {floorStats.length > 0 && (
              <div style={styles.analyticsCard} className="section-card">
                <h4 style={styles.analyticsTitle}>🏢 By Floor / Area</h4>
                {floorStats.map((f, i) => (
                  <div key={i} style={styles.barRow}>
                    <span style={{...styles.barLabel, width: 80}}>{f.label}</span>
                    <div style={styles.barTrack}>
                      <div style={{...styles.barFill, backgroundColor: theme.colors.purple, width: `${(f.count / totalCount) * 100}%`}} />
                    </div>

            {/* By Type */}
            {typeStats.length > 0 && (
              <div style={styles.analyticsCard} className="section-card">

                {typeStats.map((t, i) => (

                ))}

        )}
      </main>
    </div>
  );
}

// List Screen
function ListScreen({ title, status, data, onBack, onUpdateStatus, onUpdateMachineCase }) {
  const [showMaintenanceModal, setShowMaintenanceModal] = useState(false);
  const [selectedItem, setSelectedItem] = useState(null);
  const [actionType, setActionType] = useState(null);
  
  // Filter based on status - handle both old 'completed' and new 'closed'
  const filtered = data.filter(d => {
    if (status === 'closed') return d.status === 'closed' || d.status === 'completed';
    return d.status === status;
  });
  
  const handleAction = (item, action) => {
    if (action === 'in_progress' || action === 'closed') {
      // Show maintenance modal for these actions
      setSelectedItem(item);
      setActionType(action);
      setShowMaintenanceModal(true);
    } else {
      // Direct status update for simple actions
      onUpdateStatus(item.id, action);
    }
  };

  const handleMaintenanceSubmit = (maintenanceData) => {
    onUpdateMachineCase(selectedItem.id, maintenanceData);
    setShowMaintenanceModal(false);
    setSelectedItem(null);
    setActionType(null);
  };
  
  const getStatusActions = (item) => {
    const currentStatus = item.status;
    switch(currentStatus) {
      case 'open':
        return [
          { label: '🔧 Start Work', action: 'in_progress', color: theme.colors.info },
          { label: '⏳ Move to Pending', action: 'pending', color: theme.colors.warning },
        ];
      case 'in_progress':
        return [
          { label: '✅ Mark Complete', action: 'closed', color: theme.colors.success },
          { label: '⚠️ Back to Open', action: 'open', color: theme.colors.danger },
        ];
      case 'pending':
        return [
          { label: '🔧 Start Work', action: 'in_progress', color: theme.colors.info },
          { label: '⚠️ Reopen', action: 'open', color: theme.colors.danger },
        ];
      case 'closed':
      case 'completed':
        return [
          { label: '⚠️ Reopen', action: 'open', color: theme.colors.danger }
        ];
      default:
        return [];
    }
  };

  const getStatusBadge = (itemStatus) => {
    switch(itemStatus) {
      case 'open': return { text: 'OPEN', color: theme.colors.danger };
      case 'in_progress': return { text: 'IN PROGRESS', color: theme.colors.info };
      case 'pending': return { text: 'PENDING', color: theme.colors.warning };
      case 'closed':
      case 'completed': return { text: 'CLOSED', color: theme.colors.success };
      default: return { text: itemStatus?.toUpperCase(), color: theme.colors.textMuted };
    }
  };

  return (
    <div style={styles.screen}>
      <header style={styles.headerCompact}>
        <button style={styles.back} onClick={onBack}>←</button>
        <h1 style={styles.headerTitleC}>{title}</h1>
        <div style={{ width: 42 }} />
      </header>
      <main style={styles.main} className="responsive-content">
        <p style={styles.listCount}>{filtered.length} inspection(s)</p>
        {filtered.length === 0 ? (
          <div style={styles.emptyActivity}>
            <span style={{ fontSize: 48 }}>📭</span>
            <p style={{ color: theme.colors.textMuted, marginTop: 8 }}>No items found</p>
          </div>
        ) : (
          <div className="list-container">
            {filtered.map(d => {
              const statusBadge = getStatusBadge(d.status);
              return (
                <div key={d.id} className="list-card" style={{...styles.listCard, borderLeftColor: riskLevels.find(r => r.value === d.severity)?.color || theme.colors.border}}>
              <div style={styles.listHeader}>
                <span style={styles.listId}>{d.id}</span>
                <div style={styles.badgeRow}>
                  <span style={{...styles.severityBadge, backgroundColor: riskLevels.find(r => r.value === d.severity)?.color}}>
                    {d.severity?.toUpperCase()}
                  </span>
                  <span style={{...styles.statusBadgeSmall, backgroundColor: statusBadge.color}}>
                    {statusBadge.text}
                  </span>
                </div>
              </div>
              <h4 style={styles.listTitle}>{d.type || 'General Inspection'}</h4>
              <p style={styles.listDesc}>{d.description}</p>
              <div style={styles.listMeta}>
                <span>📅 {d.date}</span>
                <span>👤 {d.inspector}</span>
                {d.machine && <span>🔧 {d.machine}</span>}
                {d.floor && <span>🏢 Lantai {d.floor}</span>}
              </div>
              
              {/* Machine Case Info */}
              {d.machineCase && (
                <div style={styles.machineCaseInfo}>
                  <div style={styles.machineCaseHeader}>
                    <span>🔧 Machine Case Info</span>
                  </div>
                  {d.machineCase.technicianName && (
                    <p style={styles.machineCaseMeta}>👷 Technician: {d.machineCase.technicianName}</p>
                  )}
                  {d.machineCase.estimatedTime && (
                    <p style={styles.machineCaseMeta}>⏱️ Est. Time: {estimatedTimeOptions.find(t => t.value === d.machineCase.estimatedTime)?.label}</p>
                  )}
                  {d.machineCase.replacedParts && d.machineCase.replacedParts.length > 0 && (
                    <p style={styles.machineCaseMeta}>🔩 Parts: {d.machineCase.replacedParts.map(p => `${p.name} (${p.qty})`).join(', ')}</p>
                  )}
                  {d.machineCase.completedAt && (
                    <p style={styles.machineCaseMeta}>✅ Completed: {new Date(d.machineCase.completedAt).toLocaleString()}</p>
                  )}
                </div>
              )}
              
              {d.workflowStage && (
                <div style={styles.listMeta}>
                  <span>🔄 {workflowStages.find(s => s.id === d.workflowStage)?.title}</span>
                  {d.priority && <span>{priorityLevels.find(p => p.id === d.priority)?.icon} {priorityLevels.find(p => p.id === d.priority)?.label}</span>}
                  {d.qualityImpact && <span>{qualityImpacts.find(q => q.id === d.qualityImpact)?.icon} {qualityImpacts.find(q => q.id === d.qualityImpact)?.label}</span>}
                </div>
              )}
              <div style={styles.listActions}>
                {getStatusActions(d).map((action, idx) => (
                  <button 
                    key={idx}
                    style={{...styles.actionBtn, backgroundColor: action.color}}
                    onClick={() => handleAction(d, action.action)}
                  >
                    {action.label}
                  </button>
                ))}
              </div>
              </div>
            );
          })}
          </div>
        )}
      </main>

      {/* Maintenance Modal */}
      {showMaintenanceModal && selectedItem && (
        <MaintenanceModal
          item={selectedItem}
          actionType={actionType}
          onSubmit={handleMaintenanceSubmit}
          onClose={() => {
            setShowMaintenanceModal(false);
            setSelectedItem(null);
            setActionType(null);
          }}
        />
      )}
    </div>
  );
}

// Maintenance Modal Component
function MaintenanceModal({ item, actionType, onSubmit, onClose }) {
  const [checklist, setChecklist] = useState(
    item.machineCase?.checklist || 
    maintenanceChecklist.reduce((acc, c) => ({ ...acc, [c.id]: false }), {})
  );
  const [replacedParts, setReplacedParts] = useState(item.machineCase?.replacedParts || []);
  const [estimatedTime, setEstimatedTime] = useState(item.machineCase?.estimatedTime || 60);
  const [actualTime, setActualTime] = useState(item.machineCase?.actualTime || '');
  const [technicianName, setTechnicianName] = useState(item.machineCase?.technicianName || '');
  const [technicianNotes, setTechnicianNotes] = useState(item.machineCase?.technicianNotes || '');
  const [newPart, setNewPart] = useState({ partId: '', qty: 1, notes: '' });

  const updateChecklist = (id, value) => {
    setChecklist(prev => ({ ...prev, [id]: value }));
  };

  const addReplacedPart = () => {
    if (!newPart.partId) return;
    const partInfo = commonSpareParts.find(p => p.id === newPart.partId);
    if (partInfo) {
      setReplacedParts(prev => [...prev, {
        id: Date.now(),
        partId: newPart.partId,
        name: partInfo.name,
        unit: partInfo.unit,
        qty: newPart.qty,
        notes: newPart.notes
      }]);
      setNewPart({ partId: '', qty: 1, notes: '' });
    }
  };

  const removeReplacedPart = (id) => {
    setReplacedParts(prev => prev.filter(p => p.id !== id));
  };

  const handleSubmit = () => {
    const maintenanceData = {
      status: actionType,
      checklist,
      replacedParts,
      estimatedTime,
      actualTime: actualTime ? parseInt(actualTime) : null,
      technicianName,
      technicianNotes
    };
    onSubmit(maintenanceData);
  };

  const completedCount = Object.values(checklist).filter(v => v).length;
  const totalCount = maintenanceChecklist.length;
  const isStartWork = actionType === 'in_progress';
  const isComplete = actionType === 'closed';

  return (
    <div style={styles.overlay}>
      <div style={styles.maintenanceModal} className="modal-wrapper">
        <header style={styles.modalHead}>
          <h2 style={styles.modalTitle}>
            {isStartWork ? '🔧 Start Maintenance' : '✅ Complete Maintenance'}
          </h2>
          <button style={styles.closeBtn} onClick={onClose}>×</button>
        </header>

        <div style={styles.modalBody}>
          {/* Item Info */}
          <div style={styles.itemInfoBox}>
            <div style={styles.itemInfoHeader}>
              <span style={styles.itemInfoId}>{item.id}</span>
              <span style={{...styles.severityBadge, backgroundColor: riskLevels.find(r => r.value === item.severity)?.color}}>
                {item.severity?.toUpperCase()}
              </span>
            </div>
            <h4 style={styles.itemInfoTitle}>{item.type}</h4>
            <p style={styles.itemInfoMeta}>🔧 {item.machine} • 🏢 Lantai {item.floor}</p>
          </div>

          {/* Technician Info */}
          <div style={styles.maintenanceSection}>
            <h3 style={styles.maintenanceSectionTitle}>👷 Technician Info</h3>
            <input
              type="text"
              value={technicianName}
              onChange={e => setTechnicianName(e.target.value)}
              placeholder="Enter technician name"
              style={styles.input}
            />
          </div>

          {/* Estimated Time */}
          <div style={styles.maintenanceSection}>
            <h3 style={styles.maintenanceSectionTitle}>⏱️ Estimated Time</h3>
            <div style={styles.timeGrid}>
              {estimatedTimeOptions.map(t => (
                <button
                  key={t.value}
                  style={{
                    ...styles.timeBtn,
                    ...(estimatedTime === t.value ? styles.timeBtnActive : {})
                  }}
                  onClick={() => setEstimatedTime(t.value)}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </div>

          {/* Actual Time (for completion) */}
          {isComplete && (
            <div style={styles.maintenanceSection}>
              <h3 style={styles.maintenanceSectionTitle}>⏰ Actual Time (minutes)</h3>
              <input
                type="number"
                value={actualTime}
                onChange={e => setActualTime(e.target.value)}
                placeholder="Enter actual time in minutes"
                style={styles.input}
              />
            </div>
          )}

          {/* Checklist */}
          <div style={styles.maintenanceSection}>
            <h3 style={styles.maintenanceSectionTitle}>
              ✓ Maintenance Checklist 
              <span style={styles.checklistProgress}>({completedCount}/{totalCount})</span>
            </h3>
            <div style={styles.maintenanceChecklist}>
              {maintenanceChecklist.map(c => (
                <label key={c.id} style={styles.maintenanceCheckItem}>
                  <input
                    type="checkbox"
                    checked={checklist[c.id] || false}
                    onChange={e => updateChecklist(c.id, e.target.checked)}
                    style={styles.checkbox}
                  />
                  <span style={styles.checkItemIcon}>{c.icon}</span>
                  <span style={styles.checkItemLabel}>{c.label}</span>
                </label>
              ))}
            </div>
          </div>

          {/* Replaced Parts */}
          <div style={styles.maintenanceSection}>
            <h3 style={styles.maintenanceSectionTitle}>🔩 Replaced Parts</h3>
            
            {/* Add Part Form */}
            <div style={styles.addPartForm}>
              <select
                value={newPart.partId}
                onChange={e => setNewPart(p => ({ ...p, partId: e.target.value }))}
                style={styles.partSelect}
              >
                <option value="">Select part...</option>
                {commonSpareParts.map(p => (
                  <option key={p.id} value={p.id}>{p.name}</option>
                ))}
              </select>
              <input
                type="number"
                value={newPart.qty}
                onChange={e => setNewPart(p => ({ ...p, qty: parseInt(e.target.value) || 1 }))}
                min="1"
                style={styles.qtyInput}
                placeholder="Qty"
              />
              <button style={styles.addPartBtn} onClick={addReplacedPart}>+ Add</button>
            </div>

            {/* Parts List */}
            {replacedParts.length > 0 && (
              <div style={styles.partsList}>
                {replacedParts.map(p => (
                  <div key={p.id} style={styles.partItem}>
                    <span style={styles.partName}>{p.name}</span>
                    <span style={styles.partQty}>{p.qty} {p.unit}</span>
                    <button style={styles.removePartBtn} onClick={() => removeReplacedPart(p.id)}>×</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Notes */}
          <div style={styles.maintenanceSection}>
            <h3 style={styles.maintenanceSectionTitle}>📝 Technician Notes</h3>
            <textarea
              value={technicianNotes}
              onChange={e => setTechnicianNotes(e.target.value)}
              placeholder="Add any notes about the maintenance work..."
              style={styles.textarea}
              rows={3}
            />
          </div>
        </div>

        <footer style={styles.modalFoot}>
          <button style={styles.footBtn} onClick={onClose}>Cancel</button>
          <button 
            style={{...styles.footBtn, ...styles.footPrimary}}
            onClick={handleSubmit}
          >
            {isStartWork ? '🔧 Start Work' : '✅ Complete & Close'}
          </button>
        </footer>
      </div>
    </div>
  );
}

// History Screen
function HistoryScreen({ data, onBack }) {
  const [filter, setFilter] = useState('all');
  const [selectedItem, setSelectedItem] = useState(null);
  const [showDetail, setShowDetail] = useState(false);
  const [exporting, setExporting] = useState(false);

  const filtered = filter === 'all' ? data : data.filter(d => {
    if (filter === 'closed') return d.status === 'closed' || d.status === 'completed';
    return d.status === filter;
  });

  const getStatusColor = (status) => {
    switch(status) {
      case 'open': return theme.colors.danger;
      case 'in_progress': return theme.colors.info;
      case 'pending': return theme.colors.warning;
      case 'closed':
      case 'completed': return theme.colors.success;
      default: return theme.colors.textMuted;
    }
  };

  const getStatusLabel = (status) => {
    switch(status) {
      case 'in_progress': return 'IN PROGRESS';
      case 'closed': 
      case 'completed': return 'CLOSED';
      default: return status?.toUpperCase();
    }
  };

  const handleCardClick = (item) => {
    setSelectedItem(item);
    setShowDetail(true);
  };

  // Export single item to Excel
  const exportToExcel = (item) => {
    setExporting(true);
    
    try {
      // Calculate date closed
      const dateClosed = item.machineCase?.completedAt 
        ? new Date(item.machineCase.completedAt).toLocaleString() 
        : item.closedAt 
          ? new Date(item.closedAt).toLocaleString()
          : (item.status === 'closed' || item.status === 'completed') ? 'Completed' : '-';

      // Prepare data for Excel
      const exportData = [
        ['IP. MIXING DIGITAL INSPECTION - DETAIL REPORT'],
        ['Generated:', new Date().toLocaleString()],
        [''],
        ['=== BASIC INFORMATION ==='],
        ['Inspection ID', item.id],
        ['Date', item.date],
        ['Shift', item.shift || '-'],
        ['Inspector', item.inspector],
        ['Status', getStatusLabel(item.status)],
        ['Created At', item.createdAt ? new Date(item.createdAt).toLocaleString() : '-'],
        ['Date Closed', dateClosed],
        [''],
        ['=== LOCATION & EQUIPMENT ==='],
        ['Machine/Chemical', item.machine || '-'],
        ['Location/Floor', item.floor === 'A' || item.floor === 'Q' ? `${item.floor} Chemicals` : item.floor ? `Lantai ${item.floor}` : '-'],
        [''],
        ['=== ISSUE DETAILS ==='],
        ['Type', item.type || 'General Inspection'],
        ['Risk Level', item.severity?.toUpperCase() || '-'],
        ['Priority', priorityLevels.find(p => p.id === item.priority)?.label || 'Not Set'],
        ['Workflow Stage', workflowStages.find(s => s.id === item.workflowStage)?.title || '-'],
        ['Quality Impact', qualityImpacts.find(q => q.id === item.qualityImpact)?.label || '-'],
        [''],
        ['=== DESCRIPTION ==='],
        ['Description', item.description || '-'],
        [''],
      ];

      // Add Photos info if exists
      if (item.photos && item.photos.length > 0) {
        exportData.push(['=== EVIDENCE PHOTOS ===']);
        exportData.push(['Total Photos', item.photos.length]);
        item.photos.forEach((photo, idx) => {
          const category = photo.category ? inspectionCategories.find(c => c.id === photo.category)?.name || photo.category : 'General';
          exportData.push([`Photo ${idx + 1}`, `${photo.name || 'Photo'} (${category})`]);
        });
        exportData.push(['']);
      }

      // Add 5M Analysis if exists
      if (item.abnormalData?.fiveMAnalysis) {
        exportData.push(['=== 5M ROOT CAUSE ANALYSIS ===']);
        fiveMCategories.forEach(m => {
          const value = item.abnormalData.fiveMAnalysis[m.id];
          exportData.push([m.title, value || '-']);
        });
        exportData.push(['']);
      }

      // Add Machine Case info if exists
      if (item.machineCase) {
        exportData.push(['=== MAINTENANCE INFORMATION ===']);
        exportData.push(['Technician Name', item.machineCase.technicianName || '-']);
        exportData.push(['Estimated Time', estimatedTimeOptions.find(t => t.value === item.machineCase.estimatedTime)?.label || '-']);
        exportData.push(['Actual Time', item.machineCase.actualTime ? `${item.machineCase.actualTime} minutes` : '-']);
        exportData.push(['Completed At', item.machineCase.completedAt ? new Date(item.machineCase.completedAt).toLocaleString() : '-']);
        
        if (item.machineCase.replacedParts?.length > 0) {
          exportData.push(['']);
          exportData.push(['Replaced Parts:']);
          item.machineCase.replacedParts.forEach((part, idx) => {
            exportData.push([`  ${idx + 1}. ${part.name}`, `Qty: ${part.qty}`]);
          });
        }
        
        if (item.machineCase.technicianNotes) {
          exportData.push(['']);
          exportData.push(['Technician Notes', item.machineCase.technicianNotes]);
        }
      }

      // Create worksheet
      const ws = XLSX.utils.aoa_to_sheet(exportData);
      
      // Set column widths
      ws['!cols'] = [{ wch: 25 }, { wch: 50 }];
      
      // Create workbook
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Inspection Detail');
      
      // Generate filename (replace / with - for file system compatibility)
      const safeId = item.id.replace(/\//g, '-');
      const filename = `Inspection_${safeId}_${item.date}.xlsx`;
      
      // Download file
      XLSX.writeFile(wb, filename);
      
    } catch (error) {
      console.error('Export error:', error);
      alert('Error exporting to Excel. Please try again.');
    }
    
    setExporting(false);
  };

  // Export all filtered data to Excel
  const exportAllToExcel = () => {
    if (filtered.length === 0) {
      alert('No data to export');
      return;
    }
    
    setExporting(true);
    
    try {
      // Create summary sheet data
      const summaryData = [
        ['IP. MIXING DIGITAL INSPECTION - SUMMARY REPORT'],
        ['Generated:', new Date().toLocaleString()],
        ['Total Records:', filtered.length],
        ['Filter:', filter === 'all' ? 'All Records' : filter.toUpperCase()],
        [''],
        ['ID', 'Date', 'Inspector', 'Type', 'Machine', 'Location', 'Status', 'Priority', 'Risk Level', 'Workflow Stage', 'Quality Impact', 'Date Closed', 'Photos', 'Description']
      ];
      
      // Add each record
      filtered.forEach(item => {
        const dateClosed = item.machineCase?.completedAt 
          ? new Date(item.machineCase.completedAt).toLocaleDateString() 
          : item.closedAt 
            ? new Date(item.closedAt).toLocaleDateString()
            : (item.status === 'closed' || item.status === 'completed') ? 'Yes' : '-';

        summaryData.push([
          item.id,
          item.date,
          item.inspector,
          item.type || 'General Inspection',
          item.machine || '-',
          item.floor === 'A' || item.floor === 'Q' ? `${item.floor} Chemicals` : item.floor ? `Lantai ${item.floor}` : '-',
          getStatusLabel(item.status),
          priorityLevels.find(p => p.id === item.priority)?.label || 'Not Set',
          item.severity?.toUpperCase() || '-',
          workflowStages.find(s => s.id === item.workflowStage)?.title || '-',
          qualityImpacts.find(q => q.id === item.qualityImpact)?.label || '-',
          dateClosed,
          item.photos?.length || 0,
          item.description || '-'
        ]);
      });
      
      // Create worksheet
      const ws = XLSX.utils.aoa_to_sheet(summaryData);
      
      // Set column widths
      ws['!cols'] = [
        { wch: 20 }, // ID
        { wch: 12 }, // Date
        { wch: 15 }, // Inspector
        { wch: 25 }, // Type
        { wch: 12 }, // Machine
        { wch: 15 }, // Location
        { wch: 12 }, // Status
        { wch: 10 }, // Priority
        { wch: 10 }, // Risk
        { wch: 15 }, // Workflow
        { wch: 15 }, // Impact
        { wch: 12 }, // Date Closed
        { wch: 8 },  // Photos
        { wch: 40 }, // Description
      ];
      
      // Create workbook
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'All Inspections');
      
      // Generate filename
      const today = new Date().toISOString().split('T')[0];
      const filename = `Inspection_Report_${filter}_${today}.xlsx`;
      
      // Download file
      XLSX.writeFile(wb, filename);
      
    } catch (error) {
      console.error('Export error:', error);
      alert('Error exporting to Excel. Please try again.');
    }
    
    setExporting(false);
  };
  
  return (
    <div style={styles.screen}>
      <header style={styles.headerCompact}>
        <button style={styles.back} onClick={onBack}>←</button>
        <h1 style={styles.headerTitleC}>📁 History</h1>
        <button 
          style={styles.exportAllBtn} 
          onClick={exportAllToExcel}
          disabled={exporting || filtered.length === 0}
        >
          {exporting ? '...' : '📥'}
        </button>
      </header>
      <main style={styles.main} className="responsive-content">
        <div style={styles.filterRow}>
          {['all', 'open', 'in_progress', 'pending', 'closed'].map(f => (
            <button
              key={f}
              style={filter === f ? styles.filterActive : styles.filterBtn}
              onClick={() => setFilter(f)}
            >
              {f === 'all' ? 'All' : f === 'in_progress' ? 'Progress' : f.charAt(0).toUpperCase() + f.slice(1)}
            </button>
          ))}
        </div>
        <div style={styles.listHeaderRow}>
          <p style={styles.listCount}>{filtered.length} record(s)</p>
          {filtered.length > 0 && (
            <button 
              style={styles.exportAllTextBtn}
              onClick={exportAllToExcel}
              disabled={exporting}
            >
              {exporting ? 'Exporting...' : '📥 Export All to Excel'}
            </button>
          )}
        </div>
        {filtered.length === 0 ? (
          <div style={styles.emptyActivity}>
            <span style={{ fontSize: 48 }}>📭</span>
            <p style={{ color: theme.colors.textMuted, marginTop: 8 }}>No history yet</p>
          </div>
        ) : (
          <div className="list-container">
            {filtered.map(d => (
              <div 
                key={d.id} 
                className="list-card" 
                style={{...styles.historyCard, cursor: 'pointer'}}
                onClick={() => handleCardClick(d)}
              >
                <div style={styles.historyHeader}>
                  <span style={styles.historyId}>{d.id}</span>
                  <span style={{
                    ...styles.historyStatus,
                    color: getStatusColor(d.status)
                  }}>
                    {getStatusLabel(d.status)}
                  </span>
                </div>
                <h4 style={styles.historyTitle}>{d.type || 'General Inspection'}</h4>
                <div style={styles.historyMeta}>
                  <span>📅 {d.date}</span>
                  <span>👤 {d.inspector}</span>
                  {d.machine && <span>🔧 {d.machine}</span>}
                </div>
                {/* Priority Badge */}
                {d.priority && (
                  <div style={styles.historyMeta}>
                    <span>{priorityLevels.find(p => p.id === d.priority)?.icon} Priority: {priorityLevels.find(p => p.id === d.priority)?.label}</span>
                  </div>
                )}
                {/* Machine Case Summary */}
                {d.machineCase && (
                  <div style={styles.historyCaseSummary}>
                    {d.machineCase.technicianName && <span>👷 {d.machineCase.technicianName}</span>}
                    {d.machineCase.replacedParts?.length > 0 && <span>🔩 {d.machineCase.replacedParts.length} parts</span>}
                    {d.machineCase.completedAt && <span>✅ {new Date(d.machineCase.completedAt).toLocaleDateString()}</span>}

              </div>
            ))}
          </div>
        )}
      </main>

      {/* Detail Modal */}
      {showDetail && selectedItem && (
        <div style={styles.overlay}>
          <div style={styles.modal} className="modal-wrapper">
            <header style={styles.modalHead}>
              <h2 style={styles.modalTitle}>📋 Inspection Detail</h2>

            </header>

            <div style={styles.modalBody}>
              {/* Basic Info */}
              <div style={styles.detailSection}>
                <div style={styles.detailHeader}>
                  <span style={styles.detailId}>{selectedItem.id}</span>

                    ...styles.statusBadge,
                    backgroundColor: getStatusColor(selectedItem.status)
                  }}>
                    {getStatusLabel(selectedItem.status)}
                  </span>
                </div>
                <h3 style={styles.detailTitle}>{selectedItem.type || 'General Inspection'}</h3>
              </div>

              {/* Meta Info */}
              <div style={styles.detailGrid}>
                <div style={styles.detailItem}>
                  <span style={styles.detailLabel}>📅 Date</span>
                  <span style={styles.detailValue}>{selectedItem.date}</span>
                </div>
                <div style={styles.detailItem}>
                  <span style={styles.detailLabel}>👤 Inspector</span>
                  <span style={styles.detailValue}>{selectedItem.inspector}</span>
                </div>
                <div style={styles.detailItem}>
                  <span style={styles.detailLabel}>🕐 Shift</span>
                  <span style={styles.detailValue}>{selectedItem.shift?.split(' ')[0] || '-'}</span>
                </div>
                <div style={styles.detailItem}>
                  <span style={styles.detailLabel}>📆 Created</span>
                  <span style={styles.detailValue}>{selectedItem.createdAt ? new Date(selectedItem.createdAt).toLocaleString() : '-'}</span>
                </div>
                {(selectedItem.status === 'closed' || selectedItem.status === 'completed') && (
                  <div style={styles.detailItem}>
                    <span style={styles.detailLabel}>✅ Date Closed</span>
                    <span style={{...styles.detailValue, color: theme.colors.success}}>
                      {selectedItem.machineCase?.completedAt 
                        ? new Date(selectedItem.machineCase.completedAt).toLocaleString() 
                        : selectedItem.closedAt 
                          ? new Date(selectedItem.closedAt).toLocaleString()
                          : 'Completed'}
                    </span>
                  </div>
                )}
                {selectedItem.machine && (
                  <div style={styles.detailItem}>
                    <span style={styles.detailLabel}>🔧 Machine/Chemical</span>
                    <span style={styles.detailValue}>{selectedItem.machine}</span>
                  </div>
                )}
                {selectedItem.floor && (
                  <div style={styles.detailItem}>
                    <span style={styles.detailLabel}>🏢 Location</span>
                    <span style={styles.detailValue}>{selectedItem.floor === 'A' || selectedItem.floor === 'Q' ? `${selectedItem.floor} Chemicals` : `Lantai ${selectedItem.floor}`}</span>
                  </div>
                )}
              </div>

              {/* Priority & Workflow */}
              {(selectedItem.priority || selectedItem.workflowStage) && (
                <div style={styles.detailSection}>
                  <h4 style={styles.detailSectionTitle}>🎯 Status Info</h4>
                  <div style={styles.detailGrid}>
                    {selectedItem.priority && (
                      <div style={styles.detailItem}>
                        <span style={styles.detailLabel}>Priority</span>
                        <span style={{...styles.detailValue, color: priorityLevels.find(p => p.id === selectedItem.priority)?.color}}>
                          {priorityLevels.find(p => p.id === selectedItem.priority)?.icon} {priorityLevels.find(p => p.id === selectedItem.priority)?.label}
                        </span>
                      </div>
                    )}
                    {selectedItem.workflowStage && (
                      <div style={styles.detailItem}>
                        <span style={styles.detailLabel}>Workflow Stage</span>
                        <span style={styles.detailValue}>{workflowStages.find(s => s.id === selectedItem.workflowStage)?.icon} {workflowStages.find(s => s.id === selectedItem.workflowStage)?.title}</span>
                      </div>
                    )}
                    {selectedItem.qualityImpact && (
                      <div style={styles.detailItem}>
                        <span style={styles.detailLabel}>Quality Impact</span>
                        <span style={styles.detailValue}>{qualityImpacts.find(q => q.id === selectedItem.qualityImpact)?.icon} {qualityImpacts.find(q => q.id === selectedItem.qualityImpact)?.label}</span>
                      </div>
                    )}
                    {selectedItem.severity && (
                      <div style={styles.detailItem}>
                        <span style={styles.detailLabel}>Risk Level</span>
                        <span style={{...styles.detailValue, color: riskLevels.find(r => r.value === selectedItem.severity)?.color}}>
                          {riskLevels.find(r => r.value === selectedItem.severity)?.icon} {selectedItem.severity?.toUpperCase()}
                        </span>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* Description / Abnormal Notes */}
              {selectedItem.description && (
                <div style={styles.detailSection}>
                  <h4 style={styles.detailSectionTitle}>📝 Description / Notes</h4>
                  <div style={styles.detailDescBox}>
                    <p style={styles.detailDesc}>{selectedItem.description}</p>
                  </div>
                </div>
              )}

              {/* 5M Analysis if exists */}
              {selectedItem.abnormalData?.fiveMAnalysis && Object.values(selectedItem.abnormalData.fiveMAnalysis).some(v => v) && (
                <div style={styles.detailSection}>
                  <h4 style={styles.detailSectionTitle}>🔍 5M Root Cause Analysis</h4>
                  {fiveMCategories.map(m => {
                    const value = selectedItem.abnormalData.fiveMAnalysis[m.id];
                    if (!value) return null;
                    return (
                      <div key={m.id} style={styles.fiveMDetailItem}>
                        <span style={styles.fiveMDetailLabel}>{m.icon} {m.title}</span>
                        <p style={styles.fiveMDetailValue}>{value}</p>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Evidence Photos */}
              {selectedItem.photos && selectedItem.photos.length > 0 && (
                <div style={styles.detailSection}>
                  <h4 style={styles.detailSectionTitle}>📸 Evidence Photos ({selectedItem.photos.length})</h4>
                  <div style={styles.photoGrid}>
                    {selectedItem.photos.map((photo, idx) => (
                      <div key={photo.id || idx} style={styles.photoItem}>
                        <img 
                          src={photo.url} 
                          alt={photo.name || `Evidence ${idx + 1}`}
                          style={styles.photoThumbnail}
                          onClick={() => window.open(photo.url, '_blank')}
                        />
                        <div style={styles.photoInfo}>
                          <span style={styles.photoName}>{photo.name || `Photo ${idx + 1}`}</span>
                          <span style={styles.photoCategory}>
                            {photo.category ? inspectionCategories.find(c => c.id === photo.category)?.name || photo.category : 'General'}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                  <p style={styles.photoHint}>Tap photo to view full size</p>
                </div>
              )}

              {/* Machine Case Info */}
              {selectedItem.machineCase && (
                <div style={styles.detailSection}>
                  <h4 style={styles.detailSectionTitle}>🔧 Maintenance Info</h4>
                  <div style={styles.detailGrid}>

                      <div style={styles.detailItem}>

                        <span style={styles.detailValue}>{selectedItem.machineCase.technicianName}</span>
                      </div>
                    )}
                    {selectedItem.machineCase.estimatedTime && (
                      <div style={styles.detailItem}>
                        <span style={styles.detailLabel}>Est. Time</span>
                        <span style={styles.detailValue}>{estimatedTimeOptions.find(t => t.value === selectedItem.machineCase.estimatedTime)?.label}</span>
                      </div>
                    )}
                    {selectedItem.machineCase.actualTime && (
                      <div style={styles.detailItem}>
                        <span style={styles.detailLabel}>Actual Time</span>
                        <span style={styles.detailValue}>{selectedItem.machineCase.actualTime} min</span>
                      </div>

                    {selectedItem.machineCase.completedAt && (
                      <div style={styles.detailItem}>
                        <span style={styles.detailLabel}>Completed</span>
                        <span style={styles.detailValue}>{new Date(selectedItem.machineCase.completedAt).toLocaleString()}</span>
                      </div>
                    )}
                  </div>
                  {selectedItem.machineCase.replacedParts?.length > 0 && (
                    <div style={styles.detailPartsSection}>
                      <span style={styles.detailLabel}>🔩 Replaced Parts:</span>
                      <div style={styles.detailPartsList}>
                        {selectedItem.machineCase.replacedParts.map((part, idx) => (
                          <span key={idx} style={styles.detailPartBadge}>{part.name} ({part.qty})</span>
                        ))}
                      </div>
                    </div>
                  )}
                  {selectedItem.machineCase.technicianNotes && (
                    <div style={styles.detailDescBox}>
                      <span style={styles.detailLabel}>📝 Technician Notes:</span>
                      <p style={styles.detailDesc}>{selectedItem.machineCase.technicianNotes}</p>
                    </div>
                  )}
                </div>
              )}
            </div>

            <footer style={styles.modalFoot}>
              <button 
                style={{...styles.footBtn, ...styles.footExport}}
                onClick={() => exportToExcel(selectedItem)}
                disabled={exporting}
              >
                {exporting ? '⏳ Exporting...' : '📥 Export to Excel'}
              </button>
              <button style={{...styles.footBtn, ...styles.footPrimary}} onClick={() => setShowDetail(false)}>
                Close
              </button>
            </footer>
          </div>
        </div>
      )}
    </div>
  );
}
